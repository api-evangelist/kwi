aid: kwi
name: KWI
description: 'KWI is a retail technology company founded in 1985 and headquartered
  in Melville, New York, that delivers a cloud-based, unified commerce platform for
  specialty and department retailers. The platform combines an iOS mobile point-of-sale,
  merchandising and inventory optimization, order management with buy-anywhere /
  fulfill-from-anywhere fulfillment, CRM, clienteling and loyalty, the Snapshot
  real-time sales analytics application, and AI product image search, all operated
  as a SaaS managed service with helpdesk, hardware, and payments support. KWI
  describes an API layer in its platform architecture used to export data to
  third-party systems and channels --- CRMs, ERPs, SRPs, and supply chains ---
  alongside packaged connectors such as Shopify Connect and a Klaviyo connector.
  As of this profile KWI publishes no public developer portal, API reference,
  machine-readable specification, or SDKs; integration is delivered through its
  professional-services organization under customer contract.'
